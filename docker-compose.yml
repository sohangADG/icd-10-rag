name: icd-rag

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-icd_rag}
      POSTGRES_USER: ${DATABASE_USER:-icd_rag}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (copy .env.example)}
    ports:
      # Bound to localhost only, so the dev database is not exposed on the network.
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: lets you run the app, migrations and tests without a local Python install.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (copy .env.example)}
      APP_HOST: 0.0.0.0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      # Downloaded embedding models persist here between runs (not in the repo or image).
      - hf-cache:/opt/hf-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
