[project]
name = "icd-rag-service"
version = "0.1.0"
description = "Standalone, version-aware, evidence-backed ICD coding RAG service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # Ingestion: text-based PDF extraction (pdfminer.six underneath), XLSX, hardened XML parsing.
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    # HTTP client for remote (OpenAI-compatible) embedding providers.
    "httpx>=0.27",
    # Default local semantic embeddings. Install a CPU-only torch first to avoid CUDA wheels:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # Generates synthetic PDF fixtures (including permission-restricted ones) in tests.
    "reportlab>=4.2",
]
# Optional OCR path for scanned PDFs. Never used unless explicitly selected.
ocr = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL + pgvector database",
    "semantic_model: loads a real sentence-transformers model (downloads it on first use)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
